name: Sync main -> develop

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: sync-main-develop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  open-sync-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Create PR main -> develop if none exists
        continue-on-error: true
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.REPO_BOT_TOKEN || github.token }}
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const head = 'main'
            const base = 'develop'

            const { data: existing } = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:${head}`,
              base,
              state: 'open'
            })

            if (existing.length === 0) {
              await github.rest.pulls.create({
                owner,
                repo,
                title: 'Sync: merge main into develop',
                head,
                base,
                body: 'Automated sync PR created after changes landed on main.'
              })
            } else {
              core.info('A sync PR from main to develop already exists')
            }
