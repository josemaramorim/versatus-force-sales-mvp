services:

  rabbitmq:
    # Use non-alpine management image to avoid occasional registry issues
    image: rabbitmq:3.13-management
    container_name: fvs-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-fvs}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-fvs_dev_pass}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  rabbitmq_data:
