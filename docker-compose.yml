services:

  rabbitmq:
    # Use non-alpine management image to avoid occasional registry issues
    image: rabbitmq:3.13-management
    container_name: fvs-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-fvs}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-fvs_dev_pass}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  ftp:
    image: delfer/alpine-ftp-server
    container_name: fvs-ftp
    ports:
      - "21:21"
      - "21000-21010:21000-21010"
    environment:
      - FTP_USER=test
      - FTP_PASS=test
      - PASV_ADDRESS=127.0.0.1
      - PASV_MIN_PORT=21000
      - PASV_MAX_PORT=21010

volumes:
  rabbitmq_data:
