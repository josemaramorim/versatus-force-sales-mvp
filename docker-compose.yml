services:

  rabbitmq:
    # Use non-alpine management image to avoid occasional registry issues
    image: rabbitmq:3.13-management
    container_name: fvs-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-fvs}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-fvs_dev_pass}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  ftp:
    image: delfer/alpine-ftp-server
    container_name: fvs-ftp
    ports:
      - "21:21"
      - "21000-21010:21000-21010"
    environment:
      - USERS=test|test|/
      - PASV_ADDRESS=127.0.0.1
      - PASV_MIN_PORT=21000
      - PASV_MAX_PORT=21010
    volumes:
      - ./integration-sync:/integration-sync

  postgres:
    image: postgres:15
    container_name: fvs-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=forca_vendas_dev
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Mudar@!123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d

  redis:
    image: redis:7
    container_name: fvs-redis
    ports:
      - "6379:6379"

volumes:
  rabbitmq_data:
  postgres_data:
