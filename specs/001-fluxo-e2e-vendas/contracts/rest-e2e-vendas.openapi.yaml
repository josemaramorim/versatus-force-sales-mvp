openapi: 3.0.3
info:
  title: Versatus Forca de Vendas MVP - E2E API Contract
  version: 1.1.0
  description: |
    Contrato REST para historias US1, US2 e reflexos de status da US3.

    ## Historico de versoes de contrato

    | Versao | Data       | Mudanca principal |
    |--------|------------|-------------------|
    | 1.0.0  | 2026-04-12 | Contrato inicial (campo `username` no login) |
    | 1.1.0  | 2026-04-13 | Login migrado para `email`; tenant resolvido internamente; `aguardando_processamento` adicionado ao enum de status |

  x-contract-migration:
    login-field-rename:
      from-version: "1.0.0"
      to-version: "1.1.0"
      change: "Campo `username` renomeado para `email` (formato email obrigatorio). Campo `tenantId` removido do request — tenant e resolvido internamente pelo backend via lookup de email."
      transition-window: "Ate 2026-05-13 o backend aceita ambos os campos para compatibilidade retroativa. Apos essa data somente `email` sera aceito."
      action-required: "Clientes que enviam `username` devem migrar para `email` antes de 2026-05-13."
servers:
  - url: http://localhost:5000
paths:
  /auth/login:
    post:
      summary: Login por email+senha com tenant resolvido internamente
      description: |
        Autentica usuario por `email` e `senha`. O `tenantId` associado ao email e resolvido
        internamente pelo backend — nao e necessario (nem aceito) enviar tenant no request.
        Controla limite de seats ativos por tenant via Redis.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login efetuado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Credenciais invalidas ou tenant invalido
        '403':
          description: Tenant sem licenca ativa ou limite de sessoes atingido
  /auth/heartbeat:
    patch:
      summary: Renova sessao ativa para manter seat
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sessao renovada
        '401':
          description: Sessao invalida ou token ausente
  /auth/logout:
    post:
      summary: Encerra sessao e libera seat
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout efetuado
        '401':
          description: Sessao invalida
  /catalogo/clientes:
    get:
      summary: Busca clientes por tenant autenticado
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Lista de clientes do tenant
        '401':
          description: Nao autenticado
  /catalogo/produtos:
    get:
      summary: Busca produtos por tenant autenticado
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Lista de produtos do tenant
        '401':
          description: Nao autenticado
  /pedidos:
    post:
      summary: Cria pedido com status inicial rastreavel
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarPedidoRequest'
      responses:
        '201':
          description: Pedido criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CriarPedidoResponse'
        '400':
          description: Erro de validacao
        '401':
          description: Nao autenticado
    get:
      summary: Lista historico de pedidos por tenant
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: clienteId
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [rascunho, enviado, aguardando_processamento, processado, erro]
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Lista paginada
        '401':
          description: Nao autenticado
  /pedidos/{id}:
    get:
      summary: Detalha pedido por id
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalhe do pedido
        '401':
          description: Nao autenticado
        '404':
          description: Pedido nao encontrado no tenant
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginRequest:
      type: object
      description: |
        Credenciais de login. O `tenantId` NAO faz parte do request;
        e resolvido internamente a partir do email cadastrado.
        **v1.1.0**: campo renomeado de `username` para `email`.
        Janela de transicao ate 2026-05-13 (aceita `username` como alias deprecated).
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: vendedor@tenant-demo.com
          description: Email do usuario. Determina o tenant associado internamente.
        password:
          type: string
          format: password
          example: Senha@123
          description: Senha do usuario.
        username:
          type: string
          deprecated: true
          description: "DEPRECATED desde v1.1.0. Usar `email`. Aceito ate 2026-05-13 para compatibilidade retroativa."
    LoginResponse:
      type: object
      required: [accessToken, refreshToken, expiresInSeconds, tokenType]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresInSeconds:
          type: integer
        tokenType:
          type: string
          example: Bearer
    CriarPedidoRequest:
      type: object
      required: [clienteId, itens, condicaoPagamento]
      properties:
        clienteId:
          type: string
        itens:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CriarPedidoItemRequest'
        condicaoPagamento:
          $ref: '#/components/schemas/CriarPedidoCondicaoPagamentoRequest'
        observacao:
          type: string
          maxLength: 1000
    CriarPedidoItemRequest:
      type: object
      required: [produtoId, sku, nome, quantidade, precoUnitario, desconto]
      properties:
        produtoId:
          type: string
        sku:
          type: string
        nome:
          type: string
        quantidade:
          type: number
        precoUnitario:
          type: number
        desconto:
          type: number
    CriarPedidoCondicaoPagamentoRequest:
      type: object
      required: [quantidadeParcelas, primeiraDataVencimento, formaPagamento]
      properties:
        quantidadeParcelas:
          type: string
        primeiraDataVencimento:
          type: string
          format: date
        formaPagamento:
          type: string
    CriarPedidoResponse:
      type: object
      required: [pedidoId, status, itensCount, parcelasCount, totalBruto, totalDesconto, totalLiquido]
      properties:
        pedidoId:
          type: string
          format: uuid
        status:
          type: string
          enum: [rascunho, enviado, aguardando_processamento, processado, erro]
          description: |
            Transicoes validas: rascunho -> enviado -> aguardando_processamento -> processado | erro
        itensCount:
          type: integer
        parcelasCount:
          type: integer
        totalBruto:
          type: number
        totalDesconto:
          type: number
        totalLiquido:
          type: number
